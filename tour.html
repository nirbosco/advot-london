<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1440">
<title>כרטיס קורא · הספרייה הבריטית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0048FF; --blue-hi:#2F6BFF; --sky:#0DB4F4; --teal:#41CAC5; --purple:#6536EA;
  --bg:#0B1440; --bg-deep:#070D2E; --card:#121D52; --card-hi:#17246A;
  --ink:#F3F6FF; --ink-2:#C9D2F0; --dim:#9AA7D6; --line:rgba(220,227,245,.16);
  --grad:linear-gradient(105deg,#41CAC5 0%,#0DB4F4 22%,#2680F1 45%,#3B5DEC 66%,#6536EA 85%,#0048FF 100%);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55;
  min-height:100dvh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
::selection{background:rgba(13,180,244,.35);color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:12px}
.en,.num{font-family:Montserrat,Heebo,sans-serif}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- shell ---------- */
.wrap{max-width:480px;margin:0 auto;padding:0 16px calc(28px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;color:var(--dim);font-size:14px}
.lang{min-height:44px;min-width:64px;padding:0 14px;border:1px solid var(--line);border-radius:99px;font-size:14px;font-weight:700;color:var(--ink-2)}

/* ---------- welcome ---------- */
.welcome{min-height:calc(100dvh - 80px);display:flex;flex-direction:column;justify-content:center;gap:22px;padding-bottom:40px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transform:rotate(-2.5deg);margin:6px 8px 10px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.mini .strip{height:7px;background:var(--grad)}
.mini-in{padding:14px 16px 16px}
.mini-in .en{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--sky)}
.mini-slots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px}
.mini-slots i{aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(220,227,245,.28)}
.welcome h1{font-size:34px;line-height:1.15;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.welcome p{color:var(--ink-2);font-size:18px;max-width:34ch}

/* ---------- reader pass ---------- */
.pass{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.32)}
.pass .strip{height:8px;background:var(--grad)}
.pass .in{padding:16px 18px 18px}
.pass .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pass .row1 b{font-size:20px;font-weight:900}
.pass .row1 .en{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--sky)}
.pass .sub{font-size:14px;color:var(--dim);margin-top:2px}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;margin-top:16px}
.slot{width:54px;height:54px;margin:0 auto;border-radius:50%;display:grid;place-items:center;position:relative}
.slot.off{border:1.5px dashed rgba(220,227,245,.28);color:var(--dim);font-size:14px;font-weight:700}
.slot.on{border:2px solid var(--teal);color:var(--teal);background:rgba(65,202,197,.12);transform:rotate(-8deg)}
.slot.on::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(65,202,197,.45)}
.slot.press{animation:press .62s var(--ease) both}
@keyframes press{0%{transform:scale(1.6) rotate(-24deg);opacity:0;filter:blur(3px)}55%{transform:scale(.92) rotate(-6deg);opacity:1;filter:blur(0)}100%{transform:scale(1) rotate(-8deg)}}
.pass .msg{margin-top:14px;font-size:15px;color:var(--ink-2)}
.pass.full .msg b{display:block;font-size:18px;color:var(--ink)}

/* ---------- list ---------- */
.list{list-style:none;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.list li+li .item{border-top:1px solid var(--line)}
.item{width:100%;display:flex;align-items:center;gap:14px;text-align:start;background:transparent;border:0;
  padding:12px 16px;min-height:64px;transition:background .25s var(--ease)}
.item:active{background:var(--card-hi)}
.item .n{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--dim);flex-shrink:0}
.item.done .n{border-color:var(--teal);color:var(--teal)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:17px;font-weight:700;line-height:1.3}
.item .t small{display:block;font-size:14px;color:var(--dim);margin-top:1px}
.item .tag{font-size:13px;font-weight:700;border:1px solid rgba(13,180,244,.6);color:var(--sky);border-radius:99px;padding:2px 10px;flex-shrink:0}
.item.next{background:rgba(0,72,255,.2)}
.item.next .n{border-color:var(--blue-hi);color:var(--ink);background:var(--blue)}
.foot{margin-top:26px;text-align:center}
.foot button{font-size:14px;color:var(--dim);text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 10px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:99px;
  background:var(--blue);color:#fff;font-weight:800;font-size:18px;box-shadow:0 8px 22px rgba(0,0,0,.35);
  transition:transform .2s var(--ease),background .2s var(--ease)}
.btn:active{transform:scale(.98);background:#003BD6}
.btn.ghost{background:transparent;border:1.5px solid var(--line);box-shadow:none;color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- sheets (station / moment) ---------- */
.sheet{--col:max(0px,calc((100vw - 620px) / 2));position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-inline:var(--col);
  transform:translateY(100%);transition:transform .45s var(--ease),visibility 0s linear .45s;visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform .45s var(--ease)}
.x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:calc(var(--col) + 12px);z-index:3;width:44px;height:44px;border-radius:50%;
  background:rgba(7,13,46,.72);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.hero{position:relative;height:34dvh;min-height:190px;flex-shrink:0;background:#0E1748 center/cover no-repeat;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,20,64,0) 45%,rgba(11,20,64,.94) 100%)}
.hero .cnt{position:absolute;bottom:12px;inset-inline-start:16px;z-index:2;font-size:13px;color:var(--ink-2);
  background:rgba(7,13,46,.7);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.body{flex:1;overflow-y:auto;padding:16px 18px 10px;display:flex;flex-direction:column;gap:12px;max-width:520px;width:100%;margin:0 auto}
.body .where{font-size:15px;color:var(--dim);margin-top:-8px}
.body .pic{font-size:14px;color:var(--dim);margin-top:-10px}
.body h2{font-size:27px;line-height:1.2;font-weight:900;text-wrap:balance}
.body .story{font-size:17px;color:var(--ink-2)}
.fact{background:rgba(13,180,244,.09);border-radius:14px;padding:11px 14px;font-weight:700;font-size:16px;color:var(--ink)}
.look{background:rgba(65,202,197,.09);border:1px solid rgba(65,202,197,.42);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.look svg{color:var(--teal);margin-top:2px}
.look b{display:block;color:var(--teal);font-size:15px;font-weight:800}
.look p{font-size:16px;color:var(--ink-2)}
.dock{padding:10px 18px calc(16px + var(--safe-b));max-width:520px;width:100%;margin:0 auto;flex-shrink:0}

/* guess */
.guess{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.guess .q{font-size:19px;font-weight:800}
.guess .val{font-size:30px;font-weight:800;color:var(--sky);text-align:center}
.guess input[type=range]{width:100%;height:44px;background:transparent;-webkit-appearance:none;appearance:none}
.guess input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--grad)}
.guess input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--grad)}
.guess input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:#fff;border:4px solid var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.guess input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--blue)}
.guess .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:-6px}
.guess .wait{font-size:16px;color:var(--ink-2);text-align:center;padding:4px 0}
.answer{text-align:center;padding:4px 0 2px}
.answer .big{font-size:34px;font-weight:900;line-height:1.15}
.answer .big .num{color:var(--sky)}
.answer p{color:var(--ink-2);font-size:16px;margin-top:6px}
.answer .mine{font-size:14px;color:var(--dim);margin-top:8px}

/* manuscripts moment */
.ms{background:var(--bg-deep)}
@media (min-width:700px){.hero{border-radius:0 0 20px 20px}.ms .frame{margin-top:10px}}
.ms .head{padding:calc(14px + env(safe-area-inset-top,0px)) 0 8px;padding-inline:18px 66px;text-align:start}
.ms .tagline{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--sky);border:1px solid rgba(13,180,244,.45);border-radius:99px;padding:3px 12px}
.ms .intro{font-size:15px;color:var(--ink-2);margin-top:6px}
.frame{position:relative;flex:1;min-height:0;margin:6px 14px 0;border-radius:12px;overflow:hidden;background:#05091F;border:1px solid var(--line);touch-action:none}
.lbframe{margin:calc(64px + env(safe-area-inset-top,0px)) 14px 0}
.hero{cursor:zoom-in}
.hero .zoomchip{position:absolute;bottom:12px;inset-inline-end:16px;z-index:2;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);background:rgba(7,13,46,.7);border:1px solid var(--line);border-radius:99px;padding:4px 12px;min-height:32px}
.hero .zoomchip svg{width:16px;height:16px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none}
.frame .hint{position:absolute;bottom:10px;inset-inline-end:10px;font-size:13px;color:var(--ink-2);background:rgba(5,9,31,.78);border:1px solid var(--line);border-radius:99px;padding:3px 10px;pointer-events:none;transition:opacity .4s}
.cap{padding:12px 18px 4px;max-width:520px;width:100%;margin:0 auto}
.cap .meta{font-size:15px;color:var(--dim)}
.cap h3{font-size:22px;font-weight:900;line-height:1.25}
.cap p{font-size:16px;color:var(--ink-2);margin-top:4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px calc(14px + var(--safe-b));max-width:520px;width:100%;margin:0 auto}
.nav .arr{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.nav .arr[disabled]{opacity:.3}
.dots{display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(220,227,245,.25);transition:background .3s,width .3s var(--ease)}
.dots i.on{background:var(--sky);width:22px;border-radius:8px}
.nav .btn{width:auto;flex:1;min-height:52px}

/* rest */
.rest{position:fixed;inset:0;z-index:40;background:rgba(5,9,31,.96);display:grid;place-items:center;text-align:center;padding:24px;
  opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s linear .5s}
.rest.on{opacity:1;visibility:visible;transition:opacity .5s var(--ease)}
.rest svg{width:56px;height:56px;color:var(--teal);margin:0 auto 14px}
.rest h2{font-size:34px;font-weight:900}
.rest p{color:var(--dim);font-size:17px;margin-top:6px}

/* credits */
.credits{padding:calc(60px + env(safe-area-inset-top,0px)) 18px 30px;overflow-y:auto;max-width:520px;margin:0 auto;width:100%}
.credits h2{font-size:24px;font-weight:900;margin-bottom:10px}
.credits li{list-style:none;font-size:14px;color:var(--ink-2);padding:9px 0;border-bottom:1px solid var(--line)}
.credits li b{color:var(--ink);font-weight:700}
.credits a{color:var(--sky);text-underline-offset:3px}

/* ---------- host ---------- */
body.host .wrap{max-width:560px}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line)}
.hhead h1{font-size:24px;font-weight:900}
.live{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--teal);font-weight:700}
.live i{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.live.down{color:#FFB547}.live.down i{background:#FFB547}
.banner{margin-top:12px;background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.55);color:#FFD9A0;border-radius:14px;padding:10px 14px;font-size:15px}
.hlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.hcard.live-now{border-color:var(--sky);background:linear-gradient(rgba(13,180,244,.08),rgba(13,180,244,.08)),var(--card)}
.hrow{display:flex;align-items:center;gap:12px}
.hrow b{flex:1;font-size:17px}
.push{min-height:48px;padding:0 18px;border-radius:99px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
.hcard.live-now .push{background:transparent;border:1.5px solid var(--sky);color:var(--sky)}
.hsub{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.hsub .arr{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.hsub span{flex:1;text-align:center;font-size:15px;color:var(--ink-2)}
.free{margin-top:14px;width:100%;min-height:56px;border-radius:99px;border:1.5px solid var(--teal);color:var(--teal);font-weight:800;font-size:17px;background:rgba(65,202,197,.08)}
.qrbox{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.qrbox #qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin-top:10px}
.qrbox #qr img,.qrbox #qr canvas{display:block;width:200px;height:200px}
.qrbox .url{font-size:16px;font-weight:700;margin-top:8px;direction:ltr}

@media (max-height:700px){.hero{height:27dvh;min-height:150px}.body{gap:10px;padding-top:12px}.body h2{font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <span id="topline"></span>
    <button class="lang" id="langBtn" type="button" aria-label="Switch language"></button>
  </header>

  <!-- welcome -->
  <section class="welcome" id="welcome" hidden>
    <h1 data-t="w_h"></h1>
    <p data-t="w_p"></p>
    <div class="mini" aria-hidden="true"><div class="strip"></div><div class="mini-in"><span class="en">READER PASS</span><div class="mini-slots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
    <button class="btn" id="startBtn" type="button" data-t="w_btn"></button>
  </section>

  <!-- home -->
  <main id="home" hidden>
    <section class="pass" id="pass" aria-labelledby="passTitle">
      <div class="strip"></div>
      <div class="in">
        <div class="row1"><b id="passTitle" data-t="pass_t"></b><span class="en">READER PASS</span></div>
        <div class="sub" data-t="pass_sub"></div>
        <div class="stamps" id="stamps" role="list"></div>
        <p class="msg" id="passMsg" aria-live="polite"></p>
      </div>
    </section>
    <ol class="list" id="list"></ol>
    <div class="foot"><button type="button" id="credBtn" data-t="cred_btn"></button></div>
  </main>

  <!-- host -->
  <main id="hostApp" hidden>
    <div class="hhead"><h1 data-t="h_title"></h1><span class="live" id="liveCount"><i></i><span></span></span></div>
    <div class="banner" id="hostBanner" data-t="h_offline" hidden></div>
    <div class="hlist">
      <div class="hcard" id="hc-ms">
        <div class="hrow"><b data-t="h_ms"></b><button class="push" type="button" data-push="ms"></button></div>
        <div class="hsub" id="hMsNav" hidden>
          <button class="arr" type="button" id="hPrev" aria-label="prev"></button>
          <span id="hMsName"></span>
          <button class="arr" type="button" id="hNext" aria-label="next"></button>
        </div>
      </div>
      <div class="hcard" id="hc-guess"><div class="hrow"><b data-t="h_guess"></b><button class="push" type="button" data-push="guess"></button></div></div>
      <div class="hcard" id="hc-reveal"><div class="hrow"><b data-t="h_reveal"></b><button class="push" type="button" data-push="reveal"></button></div></div>
      <div class="hcard" id="hc-rest"><div class="hrow"><b data-t="h_rest"></b><button class="push" type="button" data-push="rest"></button></div></div>
    </div>
    <button class="free" type="button" id="hFree" data-t="h_free"></button>
    <div class="qrbox"><div data-t="h_qr"></div><div id="qr"></div><div class="url en">london.hotam.tech/tour</div></div>
  </main>
</div>

<!-- station sheet -->
<section class="sheet" id="st" role="dialog" aria-modal="true" aria-labelledby="stTitle">
  <button class="x" type="button" data-close aria-label="close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="hero" id="stHero"><span class="cnt" id="stCnt"></span></div>
  <div class="body">
    <h2 id="stTitle"></h2>
    <div class="where" id="stWhere"></div>
    <div class="pic" id="stPic"></div>
    <p class="story" id="stStory"></p>
    <div class="fact" id="stFact"></div>
    <div id="stGuess"></div>
    <div class="look" id="stLook"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><div><b data-t="look_t"></b><p id="stLookP"></p></div></div>
  </div>
  <div class="dock"><button class="btn" type="button" id="stBtn"></button></div>
</section>

<!-- manuscripts moment -->
<section class="sheet ms" id="ms" role="dialog" aria-modal="true" aria-labelledby="msTitle">
  <button class="x" type="button" data-close aria-label="close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="head"><span class="tagline"><span data-t="together"></span> · <span id="msCount" class="num"></span></span><p class="intro" data-t="ms_intro"></p></div>
  <div class="frame" id="msFrame"><img id="msImg" src="assets/tour/ms-golden-haggadah.webp" alt=""><span class="hint" id="msHint" data-t="zoom"></span></div>
  <div class="cap"><h3 id="msTitle"></h3><div class="meta" id="msMeta"></div><p id="msText"></p></div>
  <div class="nav">
    <button class="arr" type="button" id="msPrev"></button>
    <div class="dots" id="msDots"></div>
    <button class="arr" type="button" id="msNext"></button>
  </div>
</section>

<!-- image lightbox -->
<section class="sheet ms" id="lb" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <button class="x" type="button" data-close aria-label="close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="frame lbframe" id="lbFrame"><img id="lbImg" src="assets/tour/st-kings.webp" alt=""><span class="hint" id="lbHint" data-t="zoom"></span></div>
  <div class="cap"><h3 id="lbTitle"></h3><div class="meta" id="lbMeta"></div></div>
</section>

<!-- credits -->

  ['#msNext','#hNext'].forEach(s => $(s).innerHTML = `<svg class="i" viewBox="0 0 24 24"><path d="${next}"/></svg>`);
  const he = lang === 'he';
  document.querySelectorAll('[data-close]').forEach(b => b.setAttribute('aria-label', he ? 'סגירה' : 'Close'));
  $('#langBtn').setAttribute('aria-label', he ? 'Switch to English' : 'מעבר לעברית');
  $('#hPrev').setAttribute('aria-label', he ? 'הקודם' : 'Previous');
  $('#hNext').setAttribute('aria-label', he ? 'הבא' : 'Next');
  $('#msPrev').setAttribute('aria-label', lang==='he'?'הקודם':'Previous');
  $('#msNext').setAttribute('aria-label', lang==='he'?'הבא':'Next');
  renderHome(); renderCredits();
  if (openStop != null) fillStop(openStop);
  if ($('#ms').classList.contains('on')) fillMs();
  if (isHost) renderHost();
}
$('#langBtn').onclick = () => { lang = lang === 'he' ? 'en' : 'he'; try{ localStorage.setItem('advot-lang', lang); }catch(e){} applyLang(); };

/* ---------------- home ---------------- */
function nextIndex(){ return STOPS.findIndex(s => !S.done.includes(s.id)); }
function renderHome(pressId){
  const stamps = $('#stamps');
  stamps.innerHTML = STOPS.map((s, i) => {
    const on = S.done.includes(s.id);
    return `<div role="listitem" class="slot ${on?'on':'off'} ${pressId===s.id?'press':''}" aria-label="${L(s).t}${on?' ✓':''}">${on ? svg(s.id) : `<span class="num">${i+1}</span>`}</div>`;
  }).join('');
  const n = S.done.length, full = n === STOPS.length;
  $('#pass').classList.toggle('full', full);
  $('#passMsg').innerHTML = full ? `<b>${t('full_h')}</b>${t('full_p')}` : (n ? t('progress')(n) : t('empty'));
  const nx = nextIndex();
  $('#list').innerHTML = STOPS.map((s, i) => {
    const done = S.done.includes(s.id);
    return `<li><button type="button" class="item ${done?'done':''} ${i===nx?'next':''}" data-i="${i}">
      <span class="n">${done ? svg('check') : `<span class="num">${i+1}</span>`}</span>
      <span class="t"><b>${L(s).t}</b><small>${L(s).w}</small></span>
      ${s.kind==='ms' || s.kind==='guess' ? `<span class="tag">${t('together')}</span>` : ''}
    </button></li>`;
  }).join('');
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  const s = STOPS[+b.dataset.i];
  if (s.kind === 'ms') openMs(remote.m === 'ms' ? remote.i : 0, false);
  else openStopSheet(+b.dataset.i);
});
function stamp(id){
  if (S.done.includes(id)) return false;
  S.done.push(id); save(); return true;
}

/* ---------------- sheets ---------------- */
function openSheet(el){ el.classList.add('on'); document.body.style.overflow='hidden'; setTimeout(()=>{ const x = el.querySelector('[data-close]'); x && x.focus({preventScroll:true}); }, 60); }
function closeSheet(el){ el.classList.remove('on'); if (!document.querySelector('.sheet.on')) document.body.style.overflow=''; }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => {
  const el = b.closest('.sheet');
  if (el.id === 'st') closeStop(false);
  else if (el.id === 'ms') closeMs();
  else closeSheet(el);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ const o = document.querySelector('.sheet.on'); if (o) o.querySelector('[data-close]').click(); } });

/* ---------------- station ---------------- */
let openStop = null;
function fillStop(i){
  const s = STOPS[i], c = L(s);
  const hero = $('#stHero');
  hero.className = 'hero';
  hero.style.backgroundImage = s.img ? `url("${s.img}")` : '';
  hero.style.backgroundPosition = s.pos || '';
  hero.innerHTML = (s.img ? `<button type="button" class="zoomchip" aria-label="${t('zoom_open')}"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M10.5 8v5M8 10.5h5"/></svg>${t('zoom_open')}</button>` : '') + `<span class="cnt">${t('of')(i+1, STOPS.length)}</span>`;
  $('#stWhere').textContent = c.w;
  const pic = $('#stPic'); pic.hidden = !c.pic; pic.textContent = c.pic || '';
  $('#stTitle').textContent = c.t;
  $('#stStory').textContent = c.s;
  const fact = $('#stFact'); fact.hidden = !c.f; fact.textContent = c.f || '';
  const look = $('#stLook'); look.hidden = !c.l; $('#stLookP').textContent = c.l || '';
  const g = $('#stGuess');
  if (s.kind === 'guess') { g.hidden = false; renderGuess(); } else { g.hidden = true; g.innerHTML = ''; }
  const btn = $('#stBtn');
  btn.textContent = s.kind === 'stop' ? t('seen') : t('cont');
  btn.hidden = s.kind === 'guess' && !S.revealed;
}
function openStopSheet(i){ openStop = i; fillStop(i); $('#st .body').scrollTop = 0; openSheet($('#st')); }
function closeStop(complete){
  const i = openStop; closeSheet($('#st')); openStop = null;
  if (complete && i != null){
    const id = STOPS[i].id;
    if (stamp(id)) setTimeout(() => { renderHome(id); }, 380); else renderHome();
  }
}
$('#stBtn').onclick = () => closeStop(true);

/* guess (log scale, 1M to 500M) */
const G_MIN = Math.log(1), G_MAX = Math.log(500);
const sliderToVal = v => Math.round(Math.exp(G_MIN + (G_MAX - G_MIN) * v / 1000));
const valToSlider = n => Math.round(1000 * (Math.log(n) - G_MIN) / (G_MAX - G_MIN));
let draftGuess = 20;
function renderGuess(){
  const g = $('#stGuess'), c = L(STOPS[1]);
  if (S.revealed){
    g.innerHTML = `<div class="guess answer"><div class="big">${t('ans_big')}</div><p>${t('ans_p')}</p>${S.guess ? `<div class="mine">${t('mine')(t('mil')(S.guess))}</div>` : ''}</div>`;
    $('#stBtn').hidden = false; return;
  }
  if (S.guess){
    const waiting = hostLive() && remote.m === 'guess';
    g.innerHTML = `<div class="guess"><div class="q">${c.q}</div><div class="val">${t('mil')(`<span class="num">${S.guess}</span>`)}</div>
      ${waiting ? `<div class="wait">${t('guess_wait')}</div>` : `<button class="btn ghost" type="button" id="showAns">${t('guess_show')}</button>`}</div>`;
    const b = $('#showAns'); if (b) b.onclick = () => { S.revealed = true; save(); renderGuess(); };
    return;
  }
  g.innerHTML = `<div class="guess"><div class="q">${c.q}</div>
    <div class="val" id="gVal">${t('mil')(`<span class="num">${draftGuess}</span>`)}</div>
    <input type="range" min="0" max="1000" step="1" id="gRange" value="${valToSlider(draftGuess)}" aria-label="${c.q}">
    <div class="ends"><span>${t('ends')[0]}</span><span>${t('ends')[1]}</span></div>
    <button class="btn" type="button" id="gGo">${t('guess_btn')}</button></div>`;
  const r = $('#gRange');
  r.oninput = () => { draftGuess = sliderToVal(+r.value); $('#gVal').innerHTML = t('mil')(`<span class="num">${draftGuess}</span>`); };
  $('#gGo').onclick = () => { S.guess = draftGuess; save(); renderGuess(); };
}

/* ---------------- manuscripts moment ---------------- */
let msI = 0, msByHost = false;
function fillMs(){
  const m = MSS[msI], c = L(m), img = $('#msImg');
  if (img.getAttribute('src') !== m.img){ img.src = m.img; resetZoom(); }
  img.alt = c.t;
  $('#msMeta').textContent = c.m; $('#msTitle').textContent = c.t; $('#msText').textContent = c.p;
  $('#msCount').textContent = `${msI+1}/${MSS.length}`;
  $('#msDots').innerHTML = MSS.map((_, i) => `<i class="${i===msI?'on':''}"></i>`).join('');
  $('#msPrev').disabled = msI === 0; $('#msNext').disabled = msI === MSS.length - 1;
}
function openMs(i, byHost){ msI = i; msByHost = byHost; fillMs(); openSheet($('#ms')); }
function closeMs(){
  closeSheet($('#ms'));
  if (stamp('ms')) setTimeout(() => renderHome('ms'), 380); else renderHome();
}
$('#msPrev').onclick = () => { if (msI > 0){ msI--; fillMs(); } };
$('#msNext').onclick = () => { if (msI < MSS.length - 1){ msI++; fillMs(); } };

/* pinch / pan / double-tap zoom, shared by the manuscripts viewer and the image lightbox */
function makeZoom(frame, zimg, hint){
  const Z = { s:1, x:0, y:0 }, ptrs = new Map(); let pinch0 = null, lastTap = 0;
  const apply = () => { zimg.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`; };
  const clamp = () => {
    const w = frame.clientWidth, h = frame.clientHeight;
    Z.s = Math.min(5, Math.max(1, Z.s));
    if (Z.s === 1){ Z.x = 0; Z.y = 0; return; }
    Z.x = Math.min(0, Math.max(w - w*Z.s, Z.x));
    Z.y = Math.min(0, Math.max(h - h*Z.s, Z.y));
  };
  const at = (cx, cy, ns) => { const k = ns / Z.s; Z.x = cx - (cx - Z.x)*k; Z.y = cy - (cy - Z.y)*k; Z.s = ns; clamp(); apply(); };
  frame.addEventListener('pointerdown', e => {
    frame.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch0 = { d:Math.hypot(a.x-b.x,a.y-b.y), s:Z.s }; }
    if (ptrs.size === 1){
      const now = Date.now(), r = frame.getBoundingClientRect();
      if (now - lastTap < 300){ zimg.style.transition = 'transform .3s var(--ease)'; at(e.clientX - r.left, e.clientY - r.top, Z.s > 1.2 ? 1 : 2.6); setTimeout(()=>zimg.style.transition='', 320); hint.style.opacity = 0; }
      lastTap = now;
    }
  });
  frame.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const r = frame.getBoundingClientRect();
    if (ptrs.size === 2 && pinch0){
      const [a,b] = [...ptrs.values()];
      at((a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, pinch0.s * Math.hypot(a.x-b.x, a.y-b.y) / pinch0.d);
      hint.style.opacity = 0;
    } else if (ptrs.size === 1 && Z.s > 1){
      Z.x += e.clientX - prev.x; Z.y += e.clientY - prev.y; clamp(); apply();
    }
  });
  const end = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; };
  frame.addEventListener('pointerup', end); frame.addEventListener('pointercancel', end);
  return { reset(){ Z.s = 1; Z.x = 0; Z.y = 0; apply(); hint.style.opacity = 1; }, zoomed: () => Z.s !== 1 };
}
const msZoom = makeZoom($('#msFrame'), $('#msImg'), $('#msHint'));
const lbZoom = makeZoom($('#lbFrame'), $('#lbImg'), $('#lbHint'));
const frame = $('#msFrame');
function resetZoom(){ msZoom.reset(); }

/* station image, full screen */
function openLightbox(i){
  const s = STOPS[i], c = L(s);
  const img = $('#lbImg'); img.src = s.img; img.alt = c.t; lbZoom.reset();
  $('#lbTitle').textContent = c.t;
  $('#lbMeta').textContent = c.pic || c.w;
  openSheet($('#lb'));
}
$('#stHero').addEventListener('click', () => { if (openStop != null && STOPS[openStop].img) openLightbox(openStop); });

let swipe0 = null;
frame.addEventListener('touchstart', e => { swipe0 = e.touches.length === 1 && !msZoom.zoomed() ? e.touches[0].clientX : null; }, {passive:true});
frame.addEventListener('touchend', e => {
  if (swipe0 == null || msZoom.zoomed()) return;
  const dx = e.changedTouches[0].clientX - swipe0; swipe0 = null;
  if (Math.abs(dx) < 60) return;
  const forward = lang === 'he' ? dx > 0 : dx < 0;
  (forward ? $('#msNext') : $('#msPrev')).click();
});

/* ---------------- credits ---------------- */
function renderCredits(){
  $('#credList').innerHTML = CREDITS.map(c => `<li><b>${c[0]}</b><br>${c[1]} · <a href="${c[2]}" target="_blank" rel="noopener">${lang==='he'?'מקור':'Source'}</a></li>`).join('');
}
$('#credBtn').onclick = () => openSheet($('#cred'));

/* ---------------- rest overlay ---------------- */
function setRest(on){ $('#rest').classList.toggle('on', on); }

/* ---------------- phone: follow the host ---------------- */
function applyRemote(st){
  const at = +st.at || 0;
  if (at < lastAt) return;                       // an older host screen: ignore, never flip back
  lastBeat = Date.now();
  remote = st;
  if (at === lastAt){ if (openStop === 1 && !S.revealed) renderGuess(); return; }
  lastAt = at; store.set('advot-tour-at', at);
  if (Date.now() - at > STALE) return;            // a moment left open long ago: do not pull anyone into it
  setRest(st.m === 'rest');
  if (st.m === 'ms'){
    if (openStop != null) closeStop(false);
    if ($('#ms').classList.contains('on')){ msI = st.i; fillMs(); msByHost = true; } else openMs(st.i, true);
  } else if (st.m === 'guess' || st.m === 'reveal'){
    if ($('#ms').classList.contains('on')) closeMs();
    if (st.m === 'reveal' && S.guess == null && !S.revealed){ /* no guess given: still reveal */ }
    if (st.m === 'reveal') { S.revealed = true; save(); }
    if (openStop !== 1) openStopSheet(1); else fillStop(1);
  } else if (st.m === 'none'){
    if ($('#ms').classList.contains('on') && msByHost) closeMs();
    if (openStop === 1 && S.revealed) closeStop(true);
  }
}

let ch = null;
function connectPhone(){
  if (!window.supabase) return;
  try {
    const sb = window.supabase.createClient(SB_URL, SB_KEY, { realtime:{ params:{ eventsPerSecond:10 } } });
    let me = store.get('advot-tour-id'); if (!me){ me = Math.random().toString(36).slice(2,10); store.set('advot-tour-id', me); }
    ch = sb.channel(TOPIC, { config:{ broadcast:{ self:false }, presence:{ key: me, enabled: true } } });
    ch.on('presence', { event:'sync' }, () => {});
    ch.on('broadcast', { event:'state' }, ({ payload }) => payload && applyRemote(payload));
    ch.subscribe(async st => { if (st === 'SUBSCRIBED'){ try { await ch.track({ r:'p' }); } catch(e){} } });
  } catch(e){}
}

/* ---------------- host ---------------- */
let H = Object.assign({ m:'none', i:0, at:0 }, store.get('advot-tour-host') || {});
let hostCh = null, hostOk = false, count = 0;
function hostSend(){
  if (!hostCh || !hostOk) return;
  try { hostCh.send({ type:'broadcast', event:'state', payload:{ m:H.m, i:H.i, at:H.at } }); } catch(e){}
}
function hostSet(m, i){
  H.m = m; if (i != null) H.i = i; H.at = Date.now();
  store.set('advot-tour-host', H); renderHost(); hostSend();
}
function renderHost(){
  const live = $('#liveCount');
  live.classList.toggle('down', !hostOk);
  live.querySelector('span').textContent = hostOk ? t('h_count')(count) : t('h_off');
  $('#hostBanner').hidden = hostOk;
  const nowKey = H.m === 'ms' ? 'ms' : H.m;
  document.querySelectorAll('[data-push]').forEach(b => {
    const k = b.dataset.push, on = k === nowKey;
    b.textContent = on ? t('h_on') : t('h_push');
    b.closest('.hcard').classList.toggle('live-now', on);
  });
  $('#hMsNav').hidden = H.m !== 'ms';
  $('#hMsName').textContent = `${H.i+1}/${MSS.length} · ${L(MSS[H.i]).t}`;
  $('#hPrev').disabled = H.i === 0; $('#hNext').disabled = H.i === MSS.length - 1;
}
function startHost(){
  document.body.classList.add('host');
  $('#hostApp').hidden = false;
  document.querySelectorAll('[data-push]').forEach(b => b.onclick = () => {
    const k = b.dataset.push;
    if (H.m === k) return;
    hostSet(k, k === 'ms' ? 0 : H.i);
  });
  $('#hPrev').onclick = () => { if (H.i > 0) hostSet('ms', H.i - 1); };
  $('#hNext').onclick = () => { if (H.i < MSS.length - 1) hostSet('ms', H.i + 1); };
  $('#hFree').onclick = () => hostSet('none');
  if (window.QRCode) new QRCode($('#qr'), { text:'https://london.hotam.tech/tour', width:400, height:400, colorDark:'#0B1440', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
  renderHost();
  if (!window.supabase) return;
  try {
    const sb = window.supabase.createClient(SB_URL, SB_KEY, { realtime:{ params:{ eventsPerSecond:10 } } });
    hostCh = sb.channel(TOPIC, { config:{ broadcast:{ self:false }, presence:{ key:'host', enabled: true } } });
    const recount = () => { const ps = hostCh.presenceState(); count = Object.keys(ps).filter(k => k !== 'host').length; renderHost(); };
    hostCh.on('presence', { event:'sync' }, recount);
    hostCh.on('presence', { event:'join' }, () => { recount(); hostSend(); });
    hostCh.on('presence', { event:'leave' }, recount);
    hostCh.subscribe(st => {
      hostOk = st === 'SUBSCRIBED';
      if (hostOk) hostSend();
      renderHost();
    });
    setInterval(hostSend, 3000);
    addEventListener('online', renderHost); addEventListener('offline', () => { hostOk = false; renderHost(); });
  } catch(e){}
}

/* ---------------- boot ---------------- */
function preload(){ [...STOPS.map(s => s.img).filter(Boolean), ...MSS.map(m => m.img)].forEach(src => { const im = new Image(); im.src = src; }); }
function showHome(){ $('#welcome').hidden = true; $('#home').hidden = false; renderHome(); }
$('#startBtn').onclick = () => { S.started = true; save(); showHome(); };

applyLang();
preload();
if (isHost){ startHost(); }
else {
  if (S.started) showHome(); else $('#welcome').hidden = false;
  connectPhone();
}
addEventListener('hashchange', () => location.reload());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('tour-sw.js', { scope: './tour' }).catch(() => {});
</script>
