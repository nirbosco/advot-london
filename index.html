<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אדוות · המסע ללונדון 2026</title>
<meta name="description" content="אתר ההכנה הרשמי של משלחת אדוות ללונדון · 22 עד 26 בנובמבר 2026 · מנהיגות מחוללת שינוי">
<link rel="icon" type="image/png" href="assets/advot-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0048FF;
  --blue-deep:#3B5DEC;
  --blue-mid:#2680F1;
  --sky:#0DB4F4;
  --teal:#41CAC5;
  --purple:#6536EA;
  --white:#FEFEFE;
  --soft:#F3F6FF;
  --ink:#0B1440;
  --ink-dim:#4A5580;
  --line:#DCE3F5;
  --shadow-sm:0 1px 3px rgba(11,20,64,.08);
  --shadow-md:0 6px 20px rgba(11,20,64,.10);
  --shadow-lg:0 16px 40px rgba(11,20,64,.14);
  --shadow-brand:0 10px 28px rgba(0,72,255,.30);
  --grad:linear-gradient(105deg,#41CAC5 0%,#0DB4F4 22%,#2680F1 45%,#3B5DEC 66%,#6536EA 85%,#0048FF 100%);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --r-card:16px;
  --r-btn:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
html,body{overflow-x:clip}
body{font-family:'Heebo',sans-serif;color:var(--ink);background:var(--white);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:'Montserrat',sans-serif;font-size:15.5px}
img{max-width:100%;display:block}
a{color:var(--blue);text-decoration:none}
.en{font-family:'Montserrat',sans-serif}
.container{max-width:1200px;margin:0 auto;padding:0 24px}

/* ---------- header ---------- */
header{position:fixed;top:0;right:0;left:0;z-index:100;background:rgba(254,254,254,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
header.scrolled{border-bottom-color:var(--line);box-shadow:var(--shadow-sm)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:40px;width:auto}
.brand .date-chip{font-size:13px;font-weight:500;color:var(--blue);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-side{display:flex;align-items:center;gap:8px;flex-shrink:0}
nav.links{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;min-width:0}
nav.links a{font-size:15px;font-weight:500;color:var(--ink);padding:8px 13px;border-radius:999px;transition:background .25s var(--ease),color .25s var(--ease);white-space:nowrap}
nav.links a:hover{background:var(--soft);color:var(--blue)}
nav.links a.active{background:var(--blue);color:var(--white)}
.lang-btn{font-family:'Montserrat','Heebo',sans-serif;font-size:13.5px;font-weight:700;color:var(--blue);background:var(--white);border:1.5px solid var(--blue);border-radius:999px;padding:6px 18px;cursor:pointer;transition:background .25s var(--ease),color .25s var(--ease);white-space:nowrap}
.lang-btn:hover{background:var(--blue);color:var(--white)}
.menu-btn{display:none;background:none;border:none;cursor:pointer;padding:8px}
.menu-btn span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0;border-radius:2px}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--grad);color:var(--white);padding:190px 0 0;overflow:hidden}
.hero-video{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity 1.2s var(--ease)}
.hero-video.on{opacity:.32}
.hero-video iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:0}
.hero .ripples{position:absolute;left:-140px;top:40px;width:620px;opacity:.28;pointer-events:none;transform:rotate(8deg)}
.hero .ripples-2{position:absolute;right:-190px;bottom:-80px;width:520px;opacity:.16;pointer-events:none;transform:rotate(190deg)}
.hero-inner{position:relative;z-index:2;max-width:860px}
.kicker{display:inline-block;max-width:100%;font-size:15px;font-weight:500;background:rgba(254,254,254,.14);border:1px solid rgba(254,254,254,.35);border-radius:999px;padding:7px 20px;margin-bottom:28px;line-height:1.6}
.hero h1{font-size:clamp(44px,7vw,96px);font-weight:800;line-height:1.08;letter-spacing:-.01em;margin-bottom:20px}
.hero .lede{font-size:clamp(19px,2.2vw,24px);font-weight:400;max-width:640px;opacity:.94;margin-bottom:38px}
html[lang="en"] .hero .lede{font-size:clamp(17px,2vw,21px)}
html[lang="en"] nav.links a{font-size:14px;padding:8px 11px}
.hero .cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:72px}
.btn{display:inline-block;font-family:inherit;font-size:16px;font-weight:700;border-radius:var(--r-btn);padding:13px 30px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease);border:none}
.btn-primary{background:var(--white);color:var(--blue)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-ghost{background:transparent;color:var(--white);border:1.5px solid rgba(254,254,254,.6)}
.btn-ghost:hover{background:rgba(254,254,254,.12);transform:translateY(-2px)}
.hero-wave{display:block;width:100%;height:90px;margin-top:-1px;position:relative;z-index:3}
.stats{background:var(--white);border-bottom:1px solid var(--line)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:44px 0}
.stat{text-align:center}
.stat .num{font-family:'Montserrat','Heebo',sans-serif;font-size:clamp(34px,4vw,52px);font-weight:800;color:var(--blue);line-height:1.1}
.stat .lbl{font-size:15px;color:var(--ink-dim);font-weight:500;margin-top:6px}

/* ---------- sections ---------- */
section{padding:100px 0}
section.alt{background:var(--soft)}
.sec-kicker{font-size:14px;font-weight:700;color:var(--blue);letter-spacing:.06em;margin-bottom:12px}
h2{font-size:clamp(30px,3.6vw,48px);font-weight:800;line-height:1.2;margin-bottom:18px}
.sec-lede{font-size:20px;color:var(--ink-dim);max-width:720px;margin-bottom:56px}
html[lang="en"] .sec-lede{font-size:18px}
h3{font-size:clamp(20px,2.2vw,26px);font-weight:700}

/* why london */
.why-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:start}
.why-text p{margin-bottom:18px;font-size:17px}
html[lang="en"] .why-text p{font-size:16px}
.then-now{background:var(--blue);color:var(--white);border-radius:24px;padding:40px 36px;box-shadow:var(--shadow-brand);position:relative;overflow:hidden}
.then-now .ripples-card{position:absolute;left:-90px;bottom:-110px;width:320px;opacity:.2;transform:rotate(14deg)}
.then-now .row{position:relative;z-index:1;padding:18px 0}
.then-now .row + .row{border-top:1px solid rgba(254,254,254,.25)}
.then-now .when{font-family:'Montserrat','Heebo',sans-serif;font-size:14px;font-weight:600;opacity:.8;margin-bottom:4px}
.then-now .what{font-size:21px;font-weight:700;line-height:1.4}
html[lang="en"] .then-now .what{font-size:18px}
.then-now .foot{position:relative;z-index:1;font-size:15px;opacity:.85;padding-top:18px;border-top:1px solid rgba(254,254,254,.25)}

/* what we'll do */
.do-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.do-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:30px 26px;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.do-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.do-card .icon{width:52px;height:52px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.do-card .icon svg{width:26px;height:26px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.do-card h3{font-size:19px;margin-bottom:8px}
.do-card p{font-size:15px;color:var(--ink-dim)}
html[lang="en"] .do-card p{font-size:14px}
.reflect{margin-top:48px;background:var(--white);border:1px solid var(--line);border-inline-start:4px solid var(--teal);border-radius:var(--r-card);padding:30px 34px;font-size:18px;color:var(--ink);max-width:860px;box-shadow:var(--shadow-sm)}
html[lang="en"] .reflect{font-size:16.5px}

/* induction timeline */
.timeline{position:relative;max-width:860px}
.timeline::before{content:"";position:absolute;inset-inline-start:29px;top:8px;bottom:8px;width:2px;background:var(--line)}
.t-item{position:relative;padding-inline-start:88px;padding-bottom:44px}
.t-item:last-child{padding-bottom:0}
.t-dot{position:absolute;inset-inline-start:14px;top:2px;width:32px;height:32px;border-radius:50%;background:var(--white);border:2px solid var(--blue);color:var(--blue);font-family:'Montserrat','Heebo',sans-serif;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:1}
.t-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:26px 30px;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.t-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.t-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.t-date{font-size:18px;font-weight:700}
html[lang="en"] .t-date{font-size:16px}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:3px 14px}
.tag-live{background:var(--blue);color:var(--white)}
.tag-online{background:var(--soft);color:var(--blue);border:1px solid var(--line)}
.t-card ul{list-style:none}
.t-card li{position:relative;padding-inline-start:22px;margin-bottom:6px;color:var(--ink-dim);font-size:16px}
html[lang="en"] .t-card li{font-size:15px}
.t-card li::before{content:"";position:absolute;inset-inline-start:0;top:11px;width:8px;height:8px;border-radius:50%;background:var(--sky)}
.t-note{font-size:14px;color:var(--ink-dim);margin-top:12px;font-weight:500}

/* speakers */
.speakers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.sp-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease);display:flex;flex-direction:column}
.sp-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.sp-photo{aspect-ratio:1/.85;overflow:hidden;background:var(--soft)}
.sp-photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.sp-body{padding:24px 26px 26px;display:flex;flex-direction:column;flex:1}
.sp-name{font-size:21px;font-weight:800;margin-bottom:2px}
.sp-name-en{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;color:var(--ink-dim);letter-spacing:.03em;margin-bottom:10px}
html[lang="en"] .sp-name-en{display:none}
html[lang="en"] .sp-name{margin-bottom:10px}
.sp-role{font-size:15px;color:var(--ink-dim);margin-bottom:14px}
html[lang="en"] .sp-role{font-size:13.5px}
.sp-topic{font-size:15.5px;margin-bottom:16px}
html[lang="en"] .sp-topic{font-size:14px}
.sp-card details{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.sp-card summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--blue);list-style:none;display:flex;align-items:center;gap:6px}
.sp-card summary::-webkit-details-marker{display:none}
.sp-card summary::after{content:"+";font-size:17px;transition:transform .25s var(--ease)}
.sp-card details[open] summary::after{transform:rotate(45deg)}
.sp-card details p{font-size:14.5px;color:var(--ink-dim);margin-top:12px}
html[lang="en"] .sp-card details p{font-size:13.5px}
.sp-links{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.sp-links a{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 12px;transition:background .25s var(--ease)}
.sp-links a:hover{background:var(--soft)}
.more-soon{margin-top:36px;text-align:center;font-size:16px;color:var(--ink-dim);font-weight:500}

/* resources */
.res-cat{margin-bottom:52px}
.res-cat:last-child{margin-bottom:0}
.res-cat-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.res-cat-head .bar{width:5px;height:30px;border-radius:3px;background:var(--blue);flex-shrink:0}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.res-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:22px 24px;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease);display:flex;flex-direction:column;gap:8px}
.res-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--blue-mid)}
.res-title{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:700;color:var(--ink);line-height:1.45;direction:ltr;text-align:left}
.res-title.dyn,.res-src.dyn{direction:inherit;text-align:start;font-family:inherit}
.res-src{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;color:var(--blue);direction:ltr;text-align:left}
.res-note{font-size:14.5px;color:var(--ink-dim)}
html[lang="en"] .res-note{font-size:13.5px}
.res-debate{font-size:14px;color:var(--ink-dim);margin-top:2px}
.res-debate a{font-weight:700}
.res-intro{font-size:16.5px;color:var(--ink-dim);max-width:820px;margin-bottom:44px}
html[lang="en"] .res-intro{font-size:15.5px}

/* focus (spec 1.3) */
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero :focus-visible,.signup-cta :focus-visible,footer :focus-visible{outline-color:var(--white)}

/* speakers: highlight a card reached by link (#sp-*) */
.sp-card{scroll-margin-top:96px}
.sp-card:target{animation:spflash 2s var(--ease) forwards}
@keyframes spflash{0%,75%{box-shadow:0 0 0 3px var(--blue),var(--shadow-md)}100%{box-shadow:var(--shadow-sm)}}

/* learning-plan card (spec 2.8) */
.btn-solid{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:12px 22px;border-radius:var(--r-btn);background:var(--blue);color:var(--white);font-family:inherit;font-size:15.5px;font-weight:700;line-height:1.3;transition:filter .2s var(--ease),transform .2s var(--ease)}
.btn-solid:hover{filter:brightness(.92);transform:translateY(-1px)}
.learn-teaser{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-sm);padding:28px 32px;margin-bottom:24px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.learn-teaser .sec-kicker{margin-bottom:8px}
.learn-teaser h3{margin-bottom:8px}
.learn-teaser p{font-size:16px;color:var(--ink-dim);margin-bottom:18px}
html[lang="en"] .learn-teaser p{font-size:15px}
.lt-mods{list-style:none}
.lt-mods li + li{border-top:1px solid var(--line)}
.lt-mods a{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px;color:var(--ink)}
.lt-num{flex-shrink:0;width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px}
.lt-mods .soon .lt-num{background:var(--white);border:1.5px dashed var(--blue-mid)}
.lt-name{flex:1;font-size:15.5px;font-weight:700;line-height:1.35}
.lt-status{font-size:13px;color:var(--ink-dim);white-space:nowrap}
.lt-mods a:hover .lt-name{color:var(--blue)}
.lt-mods .lt-sep{border-top:2px solid var(--line);height:0;margin-top:4px}
.lt-mods .lt-sep + li{border-top:0}
.lt-num svg{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}


.signup-cta{position:relative;overflow:hidden;background:var(--blue);color:var(--white);border-radius:24px;padding:34px 38px;margin-top:44px;box-shadow:var(--shadow-brand);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.signup-cta .ripples-card{position:absolute;left:-90px;bottom:-120px;width:320px;opacity:.18;transform:rotate(14deg)}
.signup-cta .signup-txt{position:relative;z-index:1;max-width:560px}
.signup-cta h3{margin-bottom:6px}
.signup-cta p{font-size:16px;opacity:.9}
.signup-cta .btn{position:relative;z-index:1}
#signup .signup-cta{margin-top:0}

/* footer */
footer{background:var(--ink);color:var(--white);padding:64px 0 40px;position:relative;overflow:hidden}
footer .ripples-f{position:absolute;left:-130px;top:-60px;width:420px;opacity:.07;transform:rotate(12deg)}
.f-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}
.f-brand{display:flex;align-items:center;gap:22px}
.f-brand img{height:52px;width:auto}
.f-brand .sep{width:1px;height:36px;background:rgba(254,254,254,.25)}
.f-text{font-size:14px;color:rgba(254,254,254,.75);line-height:1.9}
.f-text.en{font-size:12px;letter-spacing:.04em}

/* reveal animation */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ---------- responsive ---------- */
@media (max-width:1240px){
  .brand .date-chip{display:none}
}
@media (max-width:1080px){
  .do-grid{grid-template-columns:repeat(2,1fr)}
  .speakers-grid{grid-template-columns:repeat(2,1fr)}
  .res-grid{grid-template-columns:repeat(2,1fr)}
  .why-grid{grid-template-columns:1fr;gap:40px}
  html{scroll-padding-top:80px}
  .nav-inner{height:64px}
  .brand img{height:32px}
  .menu-btn{display:block}
  nav.links{position:fixed;top:64px;right:0;left:0;background:var(--white);flex-direction:column;align-items:stretch;padding:12px 24px 20px;border-bottom:1px solid var(--line);box-shadow:var(--shadow-md);transform:translateY(-140%);transition:transform .35s var(--ease);z-index:99}
  nav.links.open{transform:none}
  nav.links a{padding:12px 16px;font-size:16px}
  html[lang="en"] nav.links a{padding:12px 16px;font-size:16px}
  nav.links:not(.open){visibility:hidden}
}
@media (max-width:940px){
  .hero{padding-top:140px}
  .hero .ripples{width:420px;left:-160px;opacity:.2}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:28px 16px;padding:36px 0}
  section{padding:64px 0}
  .do-grid,.speakers-grid,.res-grid{grid-template-columns:1fr}
  .t-item{padding-inline-start:64px}
  .timeline::before{inset-inline-start:21px}
  .t-dot{inset-inline-start:6px}
  .then-now{padding:32px 26px}
  .f-inner{flex-direction:column;text-align:center}
  .f-brand{flex-direction:column;gap:14px}
  .f-brand .sep{display:none}
}
/* ---------- learning-plan card: responsive ---------- */
@media (max-width:940px){
  .learn-teaser{grid-template-columns:1fr;gap:18px;padding:24px 22px}
  .sp-card{scroll-margin-top:80px}
}

/* ---------- reduced motion (spec 1.3) ---------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .btn-solid{transition:none}
  .btn-solid:hover{transform:none}
  .sp-card:target{animation:none;box-shadow:0 0 0 3px var(--blue),var(--shadow-md)}
}

</style>
</head>
<body>

<header id="header">
  <div class="container nav-inner">
    <div class="brand">
      <img src="assets/advot-logo.png" alt="אדוות · מנהיגות מחוללת שינוי">
      <span class="date-chip" data-i18n="chip"></span>
    </div>
    <nav class="links" id="navLinks">
      <a href="#home" class="active" data-i18n="nav_home"></a>
      <a href="#why" data-i18n="nav_why"></a>
      <a href="#do" data-i18n="nav_do"></a>
      <a href="#induction" data-i18n="nav_induction"></a>
      <a href="#speakers" data-i18n="nav_speakers"></a>
      <a href="learn.html" data-i18n="nav_resources"></a>
    </nav>
    <div class="nav-side">
      <button class="lang-btn" id="langBtn" aria-label="Switch language"></button>
      <button class="menu-btn" id="menuBtn" aria-label="תפריט"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

function setLang(l){
  lang=l;
  const d=I18N[l];
  document.documentElement.lang=l;
  document.documentElement.dir=(l==='he')?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=d[el.dataset.i18n];
    if(v!==undefined) el.innerHTML=v;
  });
  document.title=d.title;
  langBtn.textContent=d.lang_btn;
  if(d.lang_aria) langBtn.setAttribute('aria-label',d.lang_aria);
  try{ localStorage.setItem('advot-lang',l); }catch(e){}
  langHooks.forEach(function(f){ f(l); });
}

const spy=()=>{
  let cur=sections[0].id;
  for(const s of sections){ if(s.getBoundingClientRect().top<=120) cur=s.id; }
  navA.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+cur));
};
addEventListener('scroll',spy,{passive:true});spy();

// learning-plan card: module progress from learn.html (same origin, localStorage 'advot-learn')
langHooks.push(function(){
  const d=I18N[lang], mods={1:['m1-audio','m1-deck','m1-exec','m1-ch5'],2:['m2-audio','m2-deck','m2-ark','m2-blog']};
  let done={};
  try{ const o=JSON.parse(localStorage.getItem('advot-learn')||'null'); if(o&&o.v===1&&o.done) done=o.done; }catch(e){}
  Object.keys(mods).forEach(function(n){
    const el=document.getElementById('ltStatus'+n); if(!el) return;
    const y=mods[n].length, x=mods[n].filter(function(k){ return done[k]; }).length;
    el.textContent= x===0?d.mod_status_open:(x===y?d.mod_status_done:d.mod_status_progress.replace('{x}',x).replace('{y}',y));
  });
});

// old links to the removed schedule (#schedule, #practical, #sch-day-N) land on the team sign-up section
function goSignup(e){
  if(!/^#(schedule|practical|sch-day-\d+)$/.test(location.hash)) return;
  const s=document.getElementById('signup'); if(s) s.scrollIntoView({behavior:(e&&e.type==='hashchange')?'smooth':'instant'});
}
addEventListener('hashchange',goSignup);
addEventListener('load',goSignup);
goSignup();
langHooks.forEach(function(f){ f(lang); });

// hero background video (desktop only)
{
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = function () {
    const wrap = document.querySelector('.hero-video');
    const player = new YT.Player('ytbg', {
      videoId: 'jmoPo11ktN4',
      playerVars: { autoplay: 1, mute: 1, controls: 0, start: 16, end: 600, rel: 0, playsinline: 1, disablekb: 1, iv_load_policy: 3 },
      events: {
        onReady: function (e) {
          e.target.mute(); e.target.playVideo();
          sizeYtBg(); addEventListener('resize', sizeYtBg, { passive: true });
          setInterval(function () {
            try {
              if (e.target.getCurrentTime() >= 600) { e.target.seekTo(16); e.target.playVideo(); }
            } catch (err) {}
          }, 1000);
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) wrap.classList.add('on');
          if (e.data === YT.PlayerState.ENDED) { e.target.seekTo(16); e.target.playVideo(); }
        }
      }
    });
  };
  function sizeYtBg() {
    const hero = document.querySelector('.hero');
    const f = document.querySelector('.hero-video iframe');
    if (!hero || !f) return;
    const w = hero.offsetWidth, h = hero.offsetHeight;
    const vw = Math.max(w, h * 16 / 9), vh = Math.max(h, w * 9 / 16);
    f.style.width = Math.ceil(vw) + 'px';
    f.style.height = Math.ceil(vh) + 'px';
  }
}

// reveal on scroll
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
